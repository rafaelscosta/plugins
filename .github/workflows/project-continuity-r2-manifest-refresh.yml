name: Project Continuity R2 Manifest Refresh

on:
  push:
    branches:
      - feat/project-continuity-mobile-r2
    paths:
      - "plugins/project-continuity/**"
      - ".github/workflows/project-continuity-r2-manifest-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-continuity-mobile-r2

      - name: Generate authoritative manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("plugins/project-continuity")
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "MANIFEST.sha256":
                  continue
              lines.append(
                  f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}"
              )
          Path("/tmp/MANIFEST.generated.sha256").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit manifest only when changed
        shell: bash
        run: |
          if cmp -s plugins/project-continuity/MANIFEST.sha256 /tmp/MANIFEST.generated.sha256; then
            echo "Manifest already current."
            exit 0
          fi

          cp /tmp/MANIFEST.generated.sha256 plugins/project-continuity/MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/project-continuity/MANIFEST.sha256
          git commit -m "chore(project-continuity): refresh R2 package manifest"
          git push origin HEAD:feat/project-continuity-mobile-r2
